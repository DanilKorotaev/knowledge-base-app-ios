# TestFlight upload after green CI on main, or manual run (see docs/FASTLANE.md).
name: Deploy TestFlight

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "SemVer bump (auto = patch from commits, or honor VERSION / release-bump trailer)"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - none
        default: auto
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-testflight-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  beta:
    runs-on: macos-latest
    # Manual: always. Auto: only when CI succeeded on a push to main (not PR).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      )
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DELIVER_ALTOOL_ADDITIONAL_UPLOAD_PARAMETERS: "--use-old-altool"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare SemVer release metadata
        id: release
        env:
          RELEASE_BUMP: ${{ github.event.inputs.bump || 'auto' }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: python3 scripts/ci/prepare_release.py

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Write API secrets (xcconfig)
        env:
          KBAPP_API_BASE_URL: ${{ secrets.KBAPP_API_BASE_URL }}
          KBAPP_AUTH_TOKEN: ${{ secrets.KBAPP_AUTH_TOKEN }}
        run: |
          if [ -z "$KBAPP_API_BASE_URL" ] || [ -z "$KBAPP_AUTH_TOKEN" ]; then
            echo "::error::Add GitHub secrets KBAPP_API_BASE_URL and KBAPP_AUTH_TOKEN (see docs/API_CONFIGURATION.md)"
            exit 1
          fi
          # xcconfig: "//" starts a comment — encode URL slashes (see scripts/sync-secrets-xcconfig.sh).
          BASE_XC=$(echo "$KBAPP_API_BASE_URL" | sed 's|://|:$(SLASH)$(SLASH)|')
          cat > Config/Secrets.xcconfig <<EOF
          // Generated in CI — do not commit
          SLASH = /
          KBAPP_API_BASE_URL = ${BASE_XC}
          KBAPP_AUTH_TOKEN = ${KBAPP_AUTH_TOKEN}
          INFOPLIST_KEY_KBAppAPIBaseURL = \$(KBAPP_API_BASE_URL)
          INFOPLIST_KEY_KBAppAuthToken = \$(KBAPP_AUTH_TOKEN)
          EOF

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler: "2.5.11"
          bundler-cache: true

      - name: Install gems
        run: bundle install --jobs 4 --retry 3

      - name: Generate Xcode project (XcodeGen)
        run: bash scripts/ci/xcodegen_generate.sh

      - name: Fastlane beta
        id: beta
        continue-on-error: true
        env:
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          WIDGET_APP_IDENTIFIER: ${{ secrets.WIDGET_APP_IDENTIFIER }}
          WATCH_APP_IDENTIFIER: ${{ secrets.WATCH_APP_IDENTIFIER }}
          WATCH_WIDGET_APP_IDENTIFIER: ${{ secrets.WATCH_WIDGET_APP_IDENTIFIER }}
          SHARE_APP_IDENTIFIER: ${{ secrets.SHARE_APP_IDENTIFIER }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane beta

      - name: Commit VERSION/CHANGELOG and tag release
        id: release_git
        if: steps.beta.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          bash scripts/ci/commit_and_tag_release.sh

      - name: Notify Telegram (TestFlight)
        if: always()
        env:
          RELEASE_GIT_OUTCOME: ${{ steps.release_git.outcome || 'skipped' }}
        run: |
          python3 scripts/ci/telegram_notify.py testflight \
            --outcome "${{ steps.beta.outcome }}" \
            --release-git-outcome "${RELEASE_GIT_OUTCOME}"

      - name: Fail if TestFlight deploy failed
        if: steps.beta.outcome != 'success'
        run: exit 1

      - name: Fail if release commit/tag failed
        if: steps.beta.outcome == 'success' && steps.release_git.outcome != 'success'
        run: |
          echo "::error::TestFlight upload succeeded but VERSION/CHANGELOG/tag step failed — check commit_and_tag_release.sh"
          exit 1
