# Manual TestFlight upload after secrets are configured (see docs/FASTLANE.md, docs/API_CONFIGURATION.md).
name: Deploy TestFlight

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  beta:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Write API secrets (xcconfig)
        env:
          KBAPP_API_BASE_URL: ${{ secrets.KBAPP_API_BASE_URL }}
          KBAPP_AUTH_TOKEN: ${{ secrets.KBAPP_AUTH_TOKEN }}
        run: |
          if [ -z "$KBAPP_API_BASE_URL" ] || [ -z "$KBAPP_AUTH_TOKEN" ]; then
            echo "::error::Add GitHub secrets KBAPP_API_BASE_URL and KBAPP_AUTH_TOKEN (see docs/API_CONFIGURATION.md)"
            exit 1
          fi
          # xcconfig: "//" starts a comment — encode URL slashes (see scripts/sync-secrets-xcconfig.sh).
          BASE_XC=$(echo "$KBAPP_API_BASE_URL" | sed 's|://|:$(SLASH)$(SLASH)|')
          cat > Config/Secrets.xcconfig <<EOF
          // Generated in CI — do not commit
          SLASH = /
          KBAPP_API_BASE_URL = ${BASE_XC}
          KBAPP_AUTH_TOKEN = ${KBAPP_API_TOKEN}
          INFOPLIST_KEY_KBAppAPIBaseURL = \$(KBAPP_API_BASE_URL)
          INFOPLIST_KEY_KBAppAuthToken = \$(KBAPP_AUTH_TOKEN)
          EOF

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler: "2.5.11"
          bundler-cache: true

      - name: Install gems
        run: bundle install --jobs 4 --retry 3

      - name: Fastlane beta
        env:
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane beta
