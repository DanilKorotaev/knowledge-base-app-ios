openapi: 3.1.0
info:
  title: KB App API
  version: 1.1.0
  description: |
    Subset aligned with `knowledge-base-bot/kb_app_api/` and the iOS client.
    Human-readable spec: `docs/KB_APP_API_CONTRACT.md`.
servers:
  - url: https://example.com
paths:
  /health:
    get:
      summary: Liveness (no auth)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /api/auth/token:
    post:
      summary: Optional Bearer issuance
      description: |
        Returns 404 when `KB_APP_API_TOKEN_ENDPOINT_ENABLED=false`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: bearer }
                  expires_in:
                    description: Currently always null (config token has no expiry)
                    nullable: true
        "404":
          description: Endpoint disabled
  /api/sessions:
    get:
      summary: List sessions
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sessions, total, page, per_page]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }
    post:
      summary: Create session
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 500, default: "Новый чат" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/Session" }
  /api/sessions/search:
    get:
      summary: Search sessions by id or message text
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          description: Session id (optional `#` prefix) or substring in title/messages
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sessions, total]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
                  total: { type: integer }
  /api/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    patch:
      summary: Rename session (display_title)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/Session" }
    delete:
      summary: Soft-delete session
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
  /api/sessions/{session_id}/messages:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      summary: Message window (newest last, cursor pagination)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: before
          in: query
          required: false
          schema: { type: string }
          description: Message id — return up to `limit` messages older than this id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagesPage"
    post:
      summary: Send text message
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AcceptSSE"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, use_knowledge_base]
              properties:
                content: { type: string, minLength: 1, maxLength: 32000 }
                use_knowledge_base: { type: boolean, default: true }
      responses:
        "201":
          description: JSON — full message list after sync pipeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagesEnvelope"
        "200":
          description: SSE stream when Accept includes text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE `data:` lines with JSON objects (see ChatSSEEvent):
                  `{"status":"processing"}`, `{"delta":"…"}`, `{"error":"…"}`, `{"done":true}`.
  /api/sessions/{session_id}/messages/voice:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      summary: Edited transcription + audio → pipeline + voice attachment in DB
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AcceptSSE"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, content]
              properties:
                audio: { type: string, format: binary }
                content:
                  type: string
                  description: Non-empty edited transcription
                use_knowledge_base:
                  type: string
                  default: "true"
                  description: Form boolean — `true`/`false`/`1`/`yes`
      responses:
        "201":
          description: JSON — full message list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagesEnvelope"
        "200":
          description: SSE stream when Accept includes text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
  /api/sessions/{session_id}/messages/compose:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      summary: Single user message — text, multiple files and voice clips
      description: |
        iOS composer sends `content`, repeated `files`, repeated `audio`, and optional
        `audio_transcriptions` (JSON array of strings, one per `audio` part, same order).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AcceptSSE"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                content:
                  type: string
                  default: ""
                  description: Optional message text (at least one of content/files/audio required)
                use_knowledge_base:
                  type: string
                  default: "true"
                audio_transcriptions:
                  type: string
                  description: JSON array of transcription strings, length must match `audio` parts count
                files:
                  type: array
                  items: { type: string, format: binary }
                audio:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "201":
          description: JSON — full message list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagesEnvelope"
        "200":
          description: SSE stream when Accept includes text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
  /api/sessions/{session_id}/attachments:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      summary: Upload one file into session thread
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                use_knowledge_base:
                  type: string
                  default: "true"
                message:
                  type: string
                  description: Optional query text instead of server default prompt
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagesEnvelope"
  /api/sessions/{session_id}/attachments/{attachment_id}/file:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - name: attachment_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Download attachment (authenticated proxy)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Binary file stream
  /api/query/voice/transcribe:
    post:
      summary: Whisper ASR only (no session, no assistant reply)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: { type: string, format: binary }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [transcription]
                properties:
                  transcription: { type: string }
  /api/query/voice:
    post:
      summary: Legacy one-shot — Whisper (or hint) + full pipeline
      description: |
        Prefer `POST …/messages/voice` or `…/messages/compose` from the iOS app.
        Requires `session_id`. Provide non-empty `audio` **or** `transcription_hint`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string }
                audio: { type: string, format: binary }
                use_knowledge_base:
                  type: string
                  default: "true"
                transcription_hint: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  transcription: { type: string }
  /api/files/changes:
    get:
      summary: KB file change log
      security: [{ bearerAuth: [] }]
      parameters:
        - name: session_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FileChangeItem" }
  /api/files/revert:
    post:
      summary: Revert one file change by change record id
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_id]
              properties:
                file_id:
                  type: string
                  description: Id from GET /api/files/changes (`items[].id`)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, change_id, path]
                properties:
                  ok: { type: boolean, example: true }
                  change_id: { type: string }
                  path: { type: string }
  /api/files/share-link:
    post:
      summary: Create a Nextcloud link to current file version
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_id]
              properties:
                file_id:
                  type: string
                  description: Id from GET /api/files/changes (`items[].id`)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [url, path, change_id]
                properties:
                  url: { type: string }
                  path: { type: string }
                  change_id: { type: string }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string }
    AcceptSSE:
      name: Accept
      in: header
      schema:
        type: string
        example: "text/event-stream, application/json;q=0.9"
      description: When value includes `text/event-stream`, response is SSE instead of JSON
  schemas:
    Session:
      type: object
      required: [id, title, message_count, updated_at]
      properties:
        id: { type: string }
        title: { type: string }
        message_count: { type: integer }
        updated_at: { type: string, format: date-time }
    Message:
      type: object
      required: [id, role, content, created_at]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant, system] }
        content: { type: string }
        content_format: { type: string, enum: [markdown, html, plain] }
        created_at: { type: string, format: date-time }
        transcription: { type: string, nullable: true }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
    Attachment:
      type: object
      required: [id, file_type, download_url]
      properties:
        id: { type: string }
        file_type: { type: string, description: "photo | voice | file | …" }
        file_name: { type: string, nullable: true }
        file_size: { type: integer, nullable: true }
        mime_type: { type: string, nullable: true }
        download_url: { type: string }
        transcription: { type: string, nullable: true }
    MessagesPage:
      type: object
      required: [messages, total, has_more_older]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        total: { type: integer }
        has_more_older: { type: boolean }
    MessagesEnvelope:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
    FileChangeItem:
      type: object
      required: [id, path, change_kind]
      properties:
        id: { type: string }
        path: { type: string }
        change_kind: { type: string, enum: [created, modified, deleted] }
        before_text: { type: string, nullable: true }
        after_text: { type: string, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
    ChatSSEEvent:
      type: object
      description: JSON payload inside an SSE `data:` line
      properties:
        status:
          type: string
          enum: [processing]
          description: First event — headers flushed before long-running pipeline
        delta:
          type: string
          description: Assistant text chunk
        error:
          type: string
          description: Pipeline error message (stream may still end with done)
        done:
          type: boolean
          enum: [true]
          description: Terminal event
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            detail: { type: string }
