name: KnowledgeBaseApp
options:
  bundleIdPrefix: com.coredan
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    DEVELOPMENT_TEAM: "66C9VGAZR5"
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  KnowledgeBaseApp:
    type: application
    platform: iOS
    sources:
      - path: KnowledgeBaseApp
      - path: SharedIntents
    dependencies:
      - target: KnowledgeBaseWidgetExtension
        embed: true
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        # Empty lets Automatic pick Development vs Distribution per action (Archive uses Distribution + Match profiles).
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: "66C9VGAZR5"
        PRODUCT_BUNDLE_IDENTIFIER: com.coredan.KnowledgeBaseApp
        INFOPLIST_KEY_CFBundleDisplayName: Knowledge Base
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: KnowledgeBaseApp/Resources/Info.plist
      properties:
        CFBundleIconName: AppIcon
        # Export compliance: app only uses exempt encryption (e.g. HTTPS via Apple APIs). Update if you add custom crypto.
        ITSAppUsesNonExemptEncryption: false
        UILaunchStoryboardName: LaunchScreen
        NSMicrophoneUsageDescription: Микрофон нужен, чтобы записать голосовое сообщение, распознать речь и отправить его в чат.
  KnowledgeBaseAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KnowledgeBaseAppTests
    dependencies:
      - target: KnowledgeBaseApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  KnowledgeBaseWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: KnowledgeBaseWidget
      - path: SharedIntents
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "66C9VGAZR5"
        PRODUCT_BUNDLE_IDENTIFIER: com.coredan.KnowledgeBaseApp.Widget
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: KnowledgeBaseWidget/Info.plist
      properties:
        CFBundleDisplayName: Knowledge Base
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

# XcodeGen пересоздаёт .xcodeproj и не сохраняет ручные .xcscheme — схемы задаём здесь.
schemes:
  KnowledgeBaseApp:
    build:
      targets:
        KnowledgeBaseApp: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - KnowledgeBaseAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  KnowledgeBaseWidgetExtension:
    build:
      targets:
        KnowledgeBaseWidgetExtension: all
        KnowledgeBaseApp: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
