name: KnowledgeBaseApp
packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    from: 5.9.0
options:
  bundleIdPrefix: com.coredan
  deploymentTarget:
    iOS: "18.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    DEVELOPMENT_TEAM: "66C9VGAZR5"
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  KnowledgeBaseApp:
    type: application
    platform: iOS
    sources:
      - path: KnowledgeBaseApp
      - path: SharedIntents
      - path: SharedWatchConnectivity
    dependencies:
      - package: Alamofire
      - target: KnowledgeBaseWidgetExtension
        embed: true
      - target: KnowledgeBaseWatchApp
        embed: true
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: "66C9VGAZR5"
        PRODUCT_BUNDLE_IDENTIFIER: com.coredan.KnowledgeBaseApp
        INFOPLIST_KEY_CFBundleDisplayName: Knowledge Base
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: KnowledgeBaseApp/Resources/Info.plist
      properties:
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        UILaunchStoryboardName: LaunchScreen
        NSMicrophoneUsageDescription: Микрофон нужен, чтобы записать голосовое сообщение, распознать речь и отправить его в чат.
        KBAppAPIBaseURL: $(INFOPLIST_KEY_KBAppAPIBaseURL)
        KBAppAuthToken: $(INFOPLIST_KEY_KBAppAuthToken)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  KnowledgeBaseAppTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: KnowledgeBaseAppTests
    dependencies:
      - target: KnowledgeBaseApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_KBAppAPIBaseURL: $(INFOPLIST_KEY_KBAppAPIBaseURL)
        INFOPLIST_KEY_KBAppAuthToken: $(INFOPLIST_KEY_KBAppAuthToken)
  KnowledgeBaseWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: KnowledgeBaseWidget
      - path: SharedIntents
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "66C9VGAZR5"
        PRODUCT_BUNDLE_IDENTIFIER: com.coredan.KnowledgeBaseApp.Widget
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: KnowledgeBaseWidget/Info.plist
      properties:
        CFBundleDisplayName: Knowledge Base
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  KnowledgeBaseWatchApp:
    type: application
    platform: watchOS
    sources:
      - path: KnowledgeBaseWatchApp
      - path: SharedWatchConnectivity
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "66C9VGAZR5"
        PRODUCT_BUNDLE_IDENTIFIER: com.coredan.KnowledgeBaseApp.watch
        INFOPLIST_KEY_CFBundleDisplayName: Knowledge Base
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: KnowledgeBaseWatchApp/Info.plist
      properties:
        CFBundleIconName: AppIcon
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.coredan.KnowledgeBaseApp
        NSMicrophoneUsageDescription: Микрофон нужен для записи голосового сообщения на Apple Watch.

schemes:
  KnowledgeBaseApp:
    build:
      targets:
        KnowledgeBaseApp: all
        KnowledgeBaseWatchApp: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - KnowledgeBaseAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  KnowledgeBaseWidgetExtension:
    build:
      targets:
        KnowledgeBaseWidgetExtension: all
        KnowledgeBaseApp: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  KnowledgeBaseWatchApp:
    build:
      targets:
        KnowledgeBaseWatchApp: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
