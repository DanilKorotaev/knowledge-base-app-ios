# Soft CI config — must stay at zero violations.
# Progressive re-enable lives in docs/tasks/pending/task-epic-swiftlint-cleanup.md
# Strict inventory: docs/tasks/pending/swiftlint-strict-inventory.md (+ .json)
# Strict config: .swiftlint-strict.yml
#
# Usage (same as CI / Fastlane lint):
#   swiftlint lint --config .swiftlint.yml --strict

included:
  - KnowledgeBaseApp
  - KnowledgeBaseAppTests
  - KnowledgeBaseAppUITests
  - KnowledgeBaseShareExtension
  - KnowledgeBaseWidget
  - KnowledgeBaseWatchApp
  - KnowledgeBaseWatchWidgetExtension
  - SharedAppGroup
  - SharedIntents
  - SharedLocalization
  - SharedWatchConnectivity

excluded:
  - .build
  - DerivedData
  - fastlane
  - vendor
  - Carthage
  - Pods
  - KnowledgeBaseApp.xcodeproj
  - "**/.build"

# Rules that currently fail under the strict baseline (re-enable via epic subtasks).
disabled_rules:
  - attributes
  - cyclomatic_complexity
  - empty_string
  - file_header
  - file_length
  - file_name
  - for_where
  - force_cast
  - force_try
  - force_unwrapping
  - function_body_length
  - function_parameter_count
  - identifier_name
  - implicit_optional_initialization
  - large_tuple
  - legacy_multiple
  - line_length
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiple_closures_with_trailing_closure
  - nesting
  - non_optional_string_data_conversion
  - number_separator
  - opening_brace
  - optional_data_string_conversion
  - pattern_matching_keywords
  - redundant_type_annotation
  - required_deinit
  - sorted_imports
  - static_over_final_class
  - trailing_closure
  - trailing_newline
  - type_body_length
  - type_name
  - unneeded_synthesized_initializer
  - vertical_parameter_alignment_on_call
  - vertical_whitespace
  - vertical_whitespace_closing_braces

# Opt-ins that already pass (0 violations on 2026-10-30 inventory).
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - nslocalizedstring_key
  - object_literal
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_interface_builder
  - reduce_into
  - redundant_nil_coalescing
  - sorted_first_last
  - static_operator
  - strong_iboutlet
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_whitespace_opening_braces
  - yoda_condition

reporter: "xcode"
