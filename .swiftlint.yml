# Soft CI config — must stay at zero violations.
# Progressive re-enable lives in docs/tasks/pending/task-epic-swiftlint-cleanup.md
# Strict inventory: docs/tasks/pending/swiftlint-strict-inventory.md (+ .json)
# Strict config: .swiftlint-strict.yml
#
# Usage (same as CI / Fastlane lint):
#   swiftlint lint --config .swiftlint.yml --strict

included:
  - KnowledgeBaseApp
  - KnowledgeBaseAppTests
  - KnowledgeBaseAppUITests
  - KnowledgeBaseShareExtension
  - KnowledgeBaseWidget
  - KnowledgeBaseWatchApp
  - KnowledgeBaseWatchWidgetExtension
  - SharedAppGroup
  - SharedIntents
  - SharedLocalization
  - SharedWatchConnectivity

excluded:
  - .build
  - DerivedData
  - fastlane
  - vendor
  - Carthage
  - Pods
  - KnowledgeBaseApp.xcodeproj
  - "**/.build"

# Rules that currently fail under the strict baseline (re-enable via epic subtasks).
disabled_rules:
  - attributes
  - file_header
  - file_name
  - identifier_name
  - non_optional_string_data_conversion
  - pattern_matching_keywords
  - required_deinit
  - static_over_final_class
  - type_name

# Soft line_length: error 200; warning 160 until remaining ~150 at strict 120 are sliced.
line_length:
  warning: 160
  error: 200
  ignores_comments: true
  ignores_urls: true

# Soft size/complexity gates (iteration 11): ratcheted after ChatViewModel+ComposerMedia extract.
# Worst production files today: ChatViewModel ~1525 / type ~1511; APIClient file ~1395; fn body ≤107; params ≤7.
file_length:
  warning: 1600
  error: 1750

type_body_length:
  warning: 1600
  error: 1750

function_body_length:
  warning: 120
  error: 150

function_parameter_count:
  warning: 7
  error: 8

cyclomatic_complexity:
  warning: 15
  error: 20

nesting:
  type_level: 2
  function_level: 3

# Opt-ins that already pass (re-enabled progressively via epic).
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - nslocalizedstring_key
  - object_literal
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_interface_builder
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - sorted_imports
  - static_operator
  - strong_iboutlet
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

reporter: "xcode"
