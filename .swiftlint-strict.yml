# Strict baseline for inventory / progressive cleanup.
# CI uses `.swiftlint.yml` (soft). Agents: prefer soft for day-to-day;
# re-run this config when closing epic subtasks.
#
# Usage:
#   swiftlint lint --config .swiftlint-strict.yml --reporter json
#   swiftlint lint --config .swiftlint-strict.yml --reporter summary

included:
  - KnowledgeBaseApp
  - KnowledgeBaseAppTests
  - KnowledgeBaseAppUITests
  - KnowledgeBaseShareExtension
  - KnowledgeBaseWidget
  - KnowledgeBaseWatchApp
  - KnowledgeBaseWatchWidgetExtension
  - SharedAppGroup
  - SharedIntents
  - SharedLocalization
  - SharedWatchConnectivity

excluded:
  - .build
  - DerivedData
  - fastlane
  - vendor
  - Carthage
  - Pods
  - KnowledgeBaseApp.xcodeproj
  - "**/.build"

# Keep defaults on; opt into a broad modern set for the inventory.
opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_header
  - file_name
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - nslocalizedstring_key
  - number_separator
  - object_literal
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_interface_builder
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - required_deinit
  - sorted_first_last
  - sorted_imports
  - static_operator
  - strong_iboutlet
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

analyzer_rules:
  - unused_declaration
  - unused_import

# Strict thresholds (inventory; soft config relaxes these).
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 400
  error: 800

type_body_length:
  warning: 250
  error: 400

function_body_length:
  warning: 50
  error: 100

function_parameter_count:
  warning: 5
  error: 8

cyclomatic_complexity:
  warning: 10
  error: 20

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - url
    - URL
    - x
    - y
    - i
    - j
    - on
    - to
    - ok
    - qi
    - hr

nesting:
  type_level: 2
  function_level: 3

reporter: "xcode"
